name: Build APK AYOSO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file dari repository
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan proyek Android dari AYOSO.html
        run: |
          mkdir -p www
          cp AYOSO.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          npx cap init "AYOSO" "com.abihilmi.ayoso" --web-dir=www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Pasang icon (dari folder icons atau AYOSO.png)
        run: |
          ICON=""
          if [ -f icons/AYOSO.png ]; then ICON="icons/AYOSO.png"
          elif [ -f AYOSO.png ]; then ICON="AYOSO.png"
          else ICON=$(ls icons/*.png 2>/dev/null | head -n 1)
          fi
          if [ -n "$ICON" ]; then
            echo "Memakai icon: $ICON"
            mkdir -p assets
            convert "$ICON" -resize 1024x1024 PNG32:assets/icon.png
            npm install @capacitor/assets@3
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
          else
            echo "Icon tidak ditemukan, memakai icon bawaan"
          fi

      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: AYOSO-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
