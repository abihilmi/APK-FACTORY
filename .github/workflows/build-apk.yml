name: APK Factory

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama aplikasi"
        required: true
        default: "AYOSO"
        type: string

      app_id:
        description: "Identitas unik aplikasi Android"
        required: true
        default: "com.abihilmi.ayoso"
        type: string

      source_zip:
        description: "Nama file ZIP proyek di repository"
        required: true
        default: "AYOSO_V22_GitHub_APK_Paket_Revisi.zip"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Bangun APK
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Periksa dan ekstrak proyek
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
        run: |
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "File ZIP tidak ditemukan: $SOURCE_ZIP"
            exit 1
          fi

          mkdir source
          unzip -q "$SOURCE_ZIP" -d source

          INDEX_FILE=$(find source -type f -name index.html -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "File index.html tidak ditemukan dalam ZIP"
            exit 1
          fi

          WEB_DIR=$(dirname "$INDEX_FILE")
          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Siapkan proyek aplikasi
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          if ! echo "$APP_ID" | grep -Eq '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$'; then
            echo "Identitas aplikasi Android tidak valid"
            exit 1
          fi

          mkdir factory-app
          cd factory-app

          npm init -y

          npm install @capacitor/core@7
          npm install --save-dev @capacitor/cli@7
          npm install @capacitor/android@7

          mkdir www

          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www

      - name: Masukkan file aplikasi
        run: |
          cp -a "$WEB_DIR"/. factory-app/www/

      - name: Tambahkan Android
        working-directory: factory-app
        run: npx cap add android

      - name: Sinkronisasi aplikasi
        working-directory: factory-app
        run: npx cap sync android

      - name: Bangun APK
        working-directory: factory-app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ inputs.app_name }}
          path: factory-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
