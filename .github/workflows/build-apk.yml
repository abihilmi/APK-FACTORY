name: APK Factory

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama aplikasi"
        required: true
        default: "AYOSO"
        type: string
      app_id:
        description: "Identitas unik aplikasi Android"
        required: true
        default: "com.abihilmi.ayoso"
        type: string
      source_zip:
        description: "Nama file ZIP proyek di repository"
        required: true
        default: "AYOSO_V22_GitHub_APK_Paket_Revisi.zip"
        type: string
      icon_file:
        description: "Lokasi gambar ikon PNG, misalnya icons/AYOSO.png"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Bangun APK
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Periksa dan ekstrak proyek
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
        run: |
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "File ZIP tidak ditemukan: $SOURCE_ZIP"
            echo "File ZIP yang tersedia:"
            ls -la *.zip 2>/dev/null || true
            exit 1
          fi
          mkdir source
          unzip -q "$SOURCE_ZIP" -d source
          INDEX_FILE=$(find source -type f -name index.html -print -quit)
          if [ -z "$INDEX_FILE" ]; then
            echo "File index.html tidak ditemukan dalam ZIP"
            exit 1
          fi
          WEB_DIR=$(dirname "$INDEX_FILE")
          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Siapkan proyek aplikasi dan plugin keluar
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          if ! echo "$APP_ID" | grep -Eq '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$'; then
            echo "Identitas aplikasi Android tidak valid"
            exit 1
          fi
          mkdir factory-app
          cd factory-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/app@7
          npm install --save-dev @capacitor/cli@7 @capacitor/assets esbuild
          mkdir www
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www

      - name: Masukkan file HTML terbaru
        run: cp -a "$WEB_DIR"/. factory-app/www/

      - name: Hubungkan tombol Out ke fungsi keluar Android
        working-directory: factory-app
        run: |
          mkdir -p src
          cat > src/exit-bridge.js <<'JS'
          import { App } from '@capacitor/app';
          window.ayosoExitApp = async function () {
            try { await App.exitApp(); }
            catch (error) { console.error('Gagal menutup AYOSO:', error); }
          };
          JS
          npx esbuild src/exit-bridge.js --bundle --format=iife --outfile=www/ayoso-exit.js
          python - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          old = "try { if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) { window.Capacitor.Plugins.App.exitApp(); return; } } catch (e) {}"
          new = "try { if (typeof window.ayosoExitApp === 'function') { window.ayosoExitApp(); return; } } catch (e) {}"
          if old not in s:
              raise SystemExit('Baris pemanggil plugin lama tidak ditemukan; build dihentikan agar tidak membuat APK tanpa perbaikan.')
          s = s.replace(old, new, 1)
          tag = '<script src="ayoso-exit.js"></script>'
          if tag not in s:
              if '</body>' not in s.lower():
                  raise SystemExit('Tag penutup body tidak ditemukan; build dihentikan.')
              i = s.lower().rfind('</body>')
              s = s[:i] + tag + '\n' + s[i:]
          p.write_text(s, encoding='utf-8')
          print('Jembatan tombol keluar berhasil dipasang.')
          PY

      - name: Tambahkan Android
        working-directory: factory-app
        run: npx cap add android

      - name: Siapkan gambar ikon
        if: ${{ inputs.icon_file != '' }}
        env:
          ICON_FILE: ${{ inputs.icon_file }}
        run: |
          if [ ! -f "$ICON_FILE" ]; then
            echo "Gambar ikon tidak ditemukan: $ICON_FILE"
            exit 1
          fi
          mkdir -p factory-app/assets
          cp "$ICON_FILE" factory-app/assets/icon.png

      - name: Buat ikon Android
        if: ${{ inputs.icon_file != '' }}
        working-directory: factory-app
        run: npx capacitor-assets generate --android

      - name: Sinkronisasi aplikasi
        working-directory: factory-app
        run: npx cap sync android

      - name: Bangun APK
        working-directory: factory-app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ inputs.app_name }}
          path: factory-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
